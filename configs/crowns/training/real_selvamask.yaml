# DINOv3 Mask R-CNN real-data baseline trained on SelvaMask.

data_root_path: ${SYNTHFOREST_DATA_ROOT}/canopyrs
train_dataset_names:
  - selvamask
test_dataset_names: []

train_output_path: ${SYNTHFOREST_OUTPUT_ROOT}/detectors/training
run_name: null
post_training_benchmark:
  enabled: true
  config_path: crowns/benchmark/maskrcnn
  checkpoint_name: last.pth
  fail_on_error: false

model_type: maskrcnn
mask_probability_threshold: 0.5
dinov3_model_dir: ${SYNTHFOREST_MODEL_ROOT}/dinov3-vitl16
dinov3_model: dinov3_vitl16
dinov3_pretraining: lvd1689m
dinov3_embed_dim: 1024
dinov3_patch_size: 16
dinov3_use_fake_backbone: false
backbone_out_channels: 256
pyramid_strides: [8, 16, 32]

lora: null
train_sampling:
  fraction: 1.0
  seed: 42
  min_samples: 1

num_classes: 1
batch_size: 1
grad_accumulation_steps: 4
dataloader_num_workers: 1
seed: 42
use_amp: true
include_empty_images: true
debug_overfit_batches: 0
debug_eval_on_train: false

anchor_sizes:
  - [24, 34, 48]
  - [68, 96, 136]
  - [192, 272, 384]
aspect_ratios: [0.75, 1.0, 1.25]
box_score_thresh: 0.05
box_nms_thresh: 0.5
box_predictions_per_image: 500

augmentation:
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  # SelvaMask is 4.5 cm/px. Scaling the synthetic 5 cm/px crop range
  # [384, 992] gives [427, 1102], rounded to stride-friendly [432, 1104].
  # After resizing, this exposes roughly 2.0-9.7 cm/px to the model.
  resize_min_sizes_train: [512, 608, 704, 800, 896, 992]
  resize_min_size_eval: 992
  max_size: 992
  crop_prob: 1.0
  crop_size_range: [432, 1104]
  crop_min_intersection_ratio: 0.5
  flip_horizontal: true
  flip_vertical: true
  rotation_degrees: 30.0
  rotation_prob: 0.5
  brightness: 0.2
  brightness_prob: 0.5
  contrast: 0.2
  contrast_prob: 0.5
  saturation: 0.2
  saturation_prob: 0.5
  hue: 0.05
  hue_prob: 0.3
  gaussian_blur_prob: 0.3
  gaussian_blur_sigma: [0.1, 1.0]
  gaussian_noise_prob: 0.3
  gaussian_noise_std: [0.0, 0.02]
  jpeg_prob: 0.2
  jpeg_quality: [70, 100]
  downsample_upsample_prob: 0.2
  downsample_scale: [0.75, 1.0]

valid_mask:
  enabled: true
  source: auto
  black_pixel_tolerance: 0
  da_full_tile_min_valid_fraction: 0.95
  crop_min_valid_fraction: 0.25
  target_min_valid_fraction: 0.5
  prediction_min_valid_fraction: 0.6

stages:
  - name: detector_only
    max_iterations: 6500
    eval_interval: 500
    checkpoint_interval: 500
    train_log_interval: 10
    train_lora: false
    optimizer:
      name: AdamW
      detector_lr: 0.0001
      detector_weight_decay: 0.0001
      lora_lr: null
      lora_weight_decay: 0.0
      warmup_iterations: 500
      min_lr_factor: 0.01

validation:
  selection_metric: segm_dense_map
  map_max_detection_thresholds: [1, 10, 100]
  dense_eval_max_detections: 500
  tasks: [bbox, segm]
  batch_size: 1
  synthetic:
    data_root_path: ${SYNTHFOREST_OUTPUT_ROOT}/synthforest/crown_delineation/tiles
    dataset_names:
      - hard_negative
      - large_closed_canopy
      - small_medium
      - small_medium_legacy
    fold: valid
  real:
    data_root_path: ${SYNTHFOREST_DATA_ROOT}/canopyrs
    dataset_names: [SelvaMask]
    fold: valid
    drop_edge_tiles: false
    edge_tile_black_pixel_threshold: 0.1
    edge_tile_black_pixel_tolerance: 0
    max_products_per_dataset: null
    max_tiles_per_product: null

wandb:
  enabled: true
  project: synthforest_CInst_ft
  entity: null
  tags: [dinov3-vitl16-web, maskrcnn, real-selvamask-only, simple-baseline, fraction-baseline, frozen-backbone, da-all]
  mode: null
  log_artifacts: true
  required: false

domain_adaptation:
  enabled: true
  reference_root_path: ${SYNTHFOREST_DATA_ROOT}/domain_adaptation/crowns
  methods: [HM, PDA]
  prob: 0.6
  max_reference_images: 1200
  fda_beta_limit: [0.01, 0.05]
  hm_blend_ratio: [0.8, 1.0]
  pda_blend_ratio: [0.3, 0.5]
  pda_type: standard
