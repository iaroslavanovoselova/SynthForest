# Tile downsampled (20 cm) synthetic canopy-height scenes for Syn-20.
# Run after `synthforest prepare downsample`; override images_dir, height_maps_dir
# and product_name for each height batch.

annotations_dir: null
labels_gdf_dir: null
images_dir: ${oc.env:SYNTHFOREST_OUTPUT_ROOT,outputs}/synthforest/canopy_height/scenes/hard_negative/downsampled_20cm/images
height_maps_dir: ${oc.env:SYNTHFOREST_OUTPUT_ROOT,outputs}/synthforest/canopy_height/scenes/hard_negative/downsampled_20cm/height_maps
output_root: ${oc.env:SYNTHFOREST_OUTPUT_ROOT,outputs}/synthforest/canopy_height/tiles
product_name: hard_negative
export_mode: height
convert_to_crs_coordinates: false
save_converted_gdf_dir: null
categories_json: null
tile_size: 256
tile_overlap: 0.0
ground_resolution: null
scale_factor: null
ignore_black_white_alpha_tiles_threshold: 0.5
height_ignore_black_white_alpha_tiles_threshold: 1.01
drop_edge_tiles: false
write_valid_mask: true
valid_mask_mode: alpha
ignore_tiles_without_labels: false
train_ratio: 0.99
aoi_type: band
main_label_category_column_name: category_name
force_single_tree_category: true
single_tree_category_name: tree
single_tree_category_id: 1

hydra:
  run:
    dir: .
  output_subdir: null
