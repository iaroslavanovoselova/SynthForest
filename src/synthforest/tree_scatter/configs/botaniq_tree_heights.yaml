schema: synthforest.botaniq_tree_heights.v2
description: >
  Full-pack botaniq species height priors for runtime variant scaling.
  Ranges are realistic mature-tree targets, softly calibrated toward the eval
  CHM datasets: NEON median canopy heights are roughly 5.7-20.8 m, NEON median
  p95 heights roughly 8.9-27.4 m, and São Paulo tree pixels have p50 12.7 m,
  p75 16.2 m, p95 26.5 m, and p99 34.6 m. The mode is sampled with a triangular
  distribution so normal variants cluster near plausible canopy heights while
  preserving species morphology and occasional tall emergents.

eval_dataset_priors:
  neon_site_medians:
    canopy_height_m_min: 5.7
    canopy_height_m_median: 10.4
    canopy_height_m_max: 20.8
    p95_height_m_min: 8.9
    p95_height_m_median: 17.9
    p95_height_m_max: 27.4
    p99_height_m_min: 12.7
    p99_height_m_median: 21.5
    p99_height_m_max: 29.7
    tile_max_height_m_median: 35.6
  sao_paulo_tree_pixels:
    p50_height_m: 12.7
    p75_height_m: 16.2
    p95_height_m: 26.5
    p99_height_m: 34.6
    tree_area_fraction: 0.733

