              forest_sparse_context: 0.45
              forest_river_bias: 0.35
              forest_sparse_buildings: 0.20
            sparse:
              forest_sparse_context: 0.10
              forest_river_bias: 0.10
              forest_sparse_buildings: 0.45
              forest_rural_building_dominant: 0.35

