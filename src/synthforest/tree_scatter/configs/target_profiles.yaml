          dense: 0.35
          medium: 0.40
          sparse: 0.25
        density_variation_strength: 0.85
        density_cluster_exponent: 1.60
      mask_postprocess:
        min_visible_area_m2: 0.25
        min_final_area_m2: 0.40
        min_component_area_m2: 0.08
        gap_fill_radius_m: 0.25
        boundary_smooth_radius_m: 0.15
        boundary_component_merge_radius_m: 0.45
        boundary_component_min_area_m2: 0.08
        ordered_outer_envelope_min_area_m2: 0.60
        ordered_outer_envelope_radius_m: 0.25
      terrain:
        context:
          context_mode_weights_by_density_band:
            dense:
              none: 0.80
              trails_only: 0.10
              river_only: 0.05
              river_and_trail: 0.05
