profiles:
  small_medium_crowns:
    description: Small-to-medium crown profile for NEON/OAM/SelvaBox-like transfer.
    forest_type_weights:
      sa_tropical: 1.0
      as_tropical: 1.0
      na_coniferous: 1.0
      eu_coniferous: 0.8
      na_mixed: 0.7
      eu_mixed: 0.5
      savanna_woodland: 0.8
      af_tropical: 0.4
      mangrove: 0.3
      eu_deciduous: 0.0
      na_deciduous: 0.0
    quality_gates:
      bbox_eq_diameter_m_p05_max: 1.8
      bbox_eq_diameter_m_p50_range: [3.0, 5.5]
      bbox_eq_diameter_m_p95_range: [8.0, 12.0]
      low_density_or_empty_tile_fraction_min: 0.10
      low_density_or_empty_tile_fraction_max: 0.60
    overrides:
      scatter:
        tree_scale_min: 0.55
        tree_scale_max: 0.90
        botaniq_variant_scale_min: 0.55
        botaniq_variant_scale_max: 1.00
        botaniq_height_to_crown_scale_power: 0.45
        crown_area_fill_factor: 0.50
        canopy_closure_at_full_density: 0.82
        canopy_closure_gamma: 1.20
        stem_spacing_crown_fraction_floor: 0.35
